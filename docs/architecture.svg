<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-label="dsh-kb-sync 用法与边界图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font: 700 22px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #111827; }
      .sub   { font: 400 13px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #6b7280; }
      .h     { font: 700 15px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #111827; }
      .b     { font: 400 14px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #1f2937; }
      .mono  { font: 400 13px ui-monospace, Consolas, "Cascadia Mono", monospace; fill: #1f2937; }
      .mini  { font: 400 12px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #4b5563; }
      .warn  { font: 600 13px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #b45309; }
      .ok    { font: 600 13px "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; fill: #047857; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="672" fill="#ffffff"/>

  <text class="title" x="28" y="38">dsh-kb-sync：怎么用，以及它不碰什么</text>
  <text class="sub"   x="28" y="60">DeepSeek Harness 插件 · 只做编排：起你已有的同步命令、读它的状态与日志</text>

  <!-- 使用者 -->
  <rect x="300" y="80" width="360" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="h" x="480" y="103" text-anchor="middle">浏览器（你）</text>
  <text class="mono" x="480" y="124" text-anchor="middle">http://127.0.0.1:&lt;DSH 端口&gt;/__dsh-kb-sync/</text>

  <line x1="480" y1="136" x2="480" y2="172" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="mini" x="492" y="160">同源页面 + JSON 路由（Host 必须环回；POST 要带 x-dsh-kb-sync 头）</text>

  <!-- DSH host container -->
  <rect x="40" y="180" width="880" height="268" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="h" x="60" y="206">DSH 主机进程</text>
  <text class="sub" x="168" y="206">dsh-kb-sync（host 半部，零依赖、无安装脚本、无客户端构建）</text>

  <!-- routes column -->
  <text class="mini" x="60" y="234">它对外提供的东西</text>
  <g>
    <rect x="60" y="244" width="400" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text class="mono" x="72" y="264">GET  /            控制页（刷新状态 / 运行同步 / 体检）</text>

    <rect x="60" y="280" width="400" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text class="mono" x="72" y="300">GET  /status      状态 JSON（路径、凭据年龄、进度、日志尾部）</text>

    <rect x="60" y="316" width="400" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text class="mono" x="72" y="336">POST /run         启动你的同步命令（已在跑则 409）</text>

    <rect x="60" y="352" width="400" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text class="mono" x="72" y="372">POST /doctor      运行你的体检命令，回传输出与退出码</text>

    <rect x="60" y="388" width="400" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text class="mono" x="72" y="408">GET  /log?name=   读某个日志的尾部（白名单 + 越界拒绝）</text>
  </g>

  <!-- read column -->
  <text class="mini" x="520" y="234">它读什么（以及绝不读什么）</text>
  <g>
    <rect x="520" y="244" width="380" height="78" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text class="b" x="534" y="266">只读这些文件的元数据/尾部：</text>
    <text class="mono" x="534" y="286">.token            → 只取修改时间（年龄天数）</text>
    <text class="mono" x="534" y="305">LAST-SYNC.txt     → 末 8 行</text>
    <text class="mono" x="534" y="317">logs/*.log        → 尾部 16 KB</text>

    <rect x="520" y="330" width="380" height="88" rx="7" fill="#fff7ed" stroke="#fdba74"/>
    <text class="warn" x="534" y="352">边界（设计如此，不是建议）</text>
    <text class="b" x="534" y="373">✗ 不使用 DSH credentials 服务</text>
    <text class="b" x="534" y="392">✗ 自己不连任何网络（出网全在你的脚本里）</text>
    <text class="b" x="534" y="411">✗ 不注册提示词段落、不改核心 bundle</text>
  </g>

  <!-- arrow into pipeline -->
  <line x1="480" y1="448" x2="480" y2="492" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="mini" x="492" y="474">只有这两个动作会起子进程：ctx.subprocess.spawn（argv 全显式，不拼 shell）</text>

  <!-- pipeline -->
  <rect x="170" y="496" width="620" height="72" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text class="h" x="480" y="520" text-anchor="middle">你自己的同步命令（例：sync/sync-daily.cmd）</text>
  <text class="b" x="480" y="541" text-anchor="middle">抓取、鉴权、出网都在这里 —— 插件对你唯一的要求就是"一条能跑通的命令"</text>
  <text class="mini" x="480" y="560" text-anchor="middle">不满足也没关系：任一项缺失只让对应按钮/栏目降级，插件照常加载</text>

  <!-- two outputs -->
  <line x1="330" y1="568" x2="270" y2="612" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="630" y1="568" x2="690" y2="612" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="70" y="616" width="360" height="46" rx="9" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="b" x="86" y="637">状态与日志（插件只读）</text>
  <text class="mini" x="86" y="654">.token 的 mtime · LAST-SYNC.txt · logs/</text>

  <rect x="530" y="616" width="360" height="46" rx="9" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="b" x="546" y="637">你的产物（插件完全不碰）</text>
  <text class="mini" x="546" y="654">知识库 / 报表 / 任何它同步出来的东西</text>
</svg>
